version: '3.8'

networks:
  docknet:
    driver: bridge
    name: docknet

services:

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    networks:
      - docknet
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
#    deploy:
#      mode: replicated
#      restart_policy:
#        condition: on-failure
    networks:
      - docknet
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/news
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - config-server
      - redis
      - postgres
      - keycloak

  manager-view:
    build:
      context: ./manager-view
      dockerfile: Dockerfile
    container_name: manager-view
    deploy:
      mode: replicated
      restart_policy:
        condition: on-failure
    networks:
      - docknet
    ports:
      - "8080:8080"
    environment:
      NEWS_SERVICES_CATALOGUE_URI: http://api:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/news
    depends_on:
      - api
      - keycloak
      - postgres

  redis:
    image: redis:8.0-M03
    container_name: redis
    networks:
      - docknet
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:13.3
    container_name: postgres
    networks:
      - docknet
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak
    container_name: keycloak
    networks:
      - docknet
    ports:
      - "8082:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/realms/news/.well-known/openid-configuration" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: start-dev --import-realm
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

volumes:
  redis_data:
  postgres_data:
  keycloak_data:
