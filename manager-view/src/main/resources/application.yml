news:
  services:
    catalogue:
      uri: ${NEWS_SERVICES_CATALOGUE_URI:http://localhost:8081}
      registration-id: keycloak
server:
  port: 8080
spring:
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demo}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER-URI:http://localhost:8082/realms/news}
            user-name-attribute: preferred_username
        registration:
          keycloak:
#            redirect-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI:http://localhost:8082/login/oauth2/code/keycloak}
            client-id: api
            client-secret: HSDuGRBd7EAziOm13ItRTlNfRNzDsbcv
            scope:
              - openid
              - edit_catalogue
              - edit_catalogue
              - microprofile-jwt