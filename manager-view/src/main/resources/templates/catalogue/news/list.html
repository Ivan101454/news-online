<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Новостная лента &ndash; NEWSONLINE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" data-th-href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" data-th-href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" data-th-href="@{/css/fontello.css}">
    <link rel="stylesheet" data-th-href="@{/css/styles.css}">
</head>
<body>
<header>
    <div class="container">
        <div class="row">
            <div class="col-3">
                <h4 class="text-left text-secondary">News <span class="color-name">Online</span></h4>
            </div>
            <div class="col-6">
                <form method="get" data-th-action="@{/manager-api/news/list}" class="search-bar">
                    <label>по заголовку:<input type="text" name="headerNews" data-th-value="${headerNews}">
                    </label>
                    <label>по описанию:<input type="text" name="shortDescription" data-th-value="${shortDescription}">
                    </label>
                    <button type="submit">Поиск</button>
                </form>
            </div>
            <div class="col-3 search-bar logout">
                <form data-th-action="@{/logout}" method="post">
                    <button type="submit">Logout</button>
                </form>
            </div>
        </div>
    </div>
</header>
<a data-th-href="@{/manager-api/news/create}">&llarr; Создать новую новость</a>
<h1>Список новостей</h1>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Заголовок</th>
        <th>Содержание</th>
    </tr>
    </thead>
    <tbody>
    <tr data-th-each="news : ${list}">
        <td data-th-text="${news.articleId}"></td>
        <td>
            <a data-th-href="@{/manager-api/news/{articleId}(articleId=${news.articleId})}"
               data-th-text="${news.headerNews}"></a>
        </td>
        <td data-th-text="${news.shortDescription}"></td>
    </tr>
    </tbody>
</table>
<form method="get" data-th-action="@{/manager-api/news/list}">
    <label>перейти<input type="text" name="pageNumber" data-th-value="${page}">
    </label><br>
    <button type="submit">Следующая страница</button>
</form>
<script data-th-src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
