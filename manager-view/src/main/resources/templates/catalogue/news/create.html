<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Создание новости &ndash; NEWSONLINE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" data-th-href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" data-th-href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<a data-th-href="@{/manager-api/news/list}">&llarr; К списку новостей</a>
<h1>Создание новости</h1>
<div data-th-if="${errors}">
    <h2>Допущены ошибки</h2>
    <ul>
        <li data-th-each="error:${errors}" data-th-text="${error}"></li>
    </ul>
</div>
<form method="post" data-th-action="@{/manager-api/news/create}" enctype="multipart/form-data">
    <label>
        Артикль:<br>
        <input type="text" name="articleId" data-th-value="${news?.articleId()}">
    </label><br>
    <label>
        Заголовок новости:<br>
        <textarea type="text" name="headerNews" data-th-text="${news?.headerNews}" rows="10" cols="50"></textarea>
    </label><br>
    <label>
        Краткое описание:<br>
        <textarea type="text" name="shortDescription" data-th-text="${news?.shortDescription}" rows="10" cols="50"></textarea>
    </label><br>
    <label>
        Фото:<br>
        <input type="file" name="image" accept="image/*">
    </label><br>
    <label>
        Опубликовано:<br>
        <input type="checkbox" name="isPublished" th:checked="${news?.isPublished}">
    </label><br>
    <label>
        Категория:<br>
        <select name="section">
            <option data-th-each="kind: ${kindList}" data-th-value="${kind}" data-th-text="${kind}"></option>
        </select>
    </label><br>
    <button type="submit">Создать</button>
</form>
<script data-th-src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
