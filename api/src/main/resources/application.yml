server:
  port: 8081
spring:
  application:
    name: api
  config:
    import: optional:configserver:http://localhost:8888
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cloud:
    config:
      username: catalogue_service_user
      password: 'password'
      fail-fast: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/news
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: api
            client-secret: HSDuGRBd7EAziOm13ItRTlNfRNzDsbcv
            scope:
              - openid
              - edit_catalogue
              - get_settings
              - microprofile-jwt
